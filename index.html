<!DOCTYPE html>
<html>
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script src="https://unpkg.com/3d-force-graph@1"></script>
</head>
<body>

    <button id="add-panel-btn">Add Panel</button>
    <button id="analysis-btn">Show Analysis</button>
    <div id="legend" class="legend">
                    <p>Degree color key</p>
                    <p><span class="color-box green"></span> higher degree</p>
                    <p><span class="color-box yellow"></span> lower degree</p>
                    <p><span class="color-box red"></span> isolated</p>
    </div>
    <div id="panels-container"></div>
    <div id="analysis-box"></div>
    <style>
        body {
            margin: 20px;
            background-color: #000000;
            color: #ffffff;
        }

        #cy {
            width: 100%;
            height: 600px;
            border: 1px solid #160b0b;
        }

            #add-panel-button {
            margin: 10px;
            padding: 8px 14px;
            font-size: 22px;
            cursor: pointer;
        }

        #panels-container {
            width: 100%;
        }
        .panel-row {
            display: flex;
            gap: 12px;
            margin: 15px 0;
            align-items: stretch;
        }

        .graph-pane {
            height: 500px;
            width: 600px;
            border: 1px solid #fdfdfd;
        }

        .legend {
            padding: 10px;
            min-width: 150px;
        }

        #legend {
            position: fixed;
            top: 10px;
            right: 20px;
            z-index: 1000;

            background: rgba(0, 0, 0, 0.2);
            border: 1px solid #aaa;
            border-radius: 8px;
            padding: 10px 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);

            font-size: 14px;
        }
        .color-box {
            display: inline-block;
            width: 14px;
            height: 14px;
            margin-right: 5px;
            vertical-align: middle;
            border: 1px solid #777;
        }

        .green {
            background-color: #4ade80;
        }

        .yellow {
            background-color: #facc15;
        }

        .red {
            background-color: #f87171;
        }

        #analysis-box {
            display: none;
            position: fixed;        /* stays in corner regardless of scroll */
            bottom: 24px;
            right: 24px;
            width: 320px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 16px;
            padding: 20px;
            z-index: 1000;
            color: #ffffff;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
        }

        #analysis-box.visible {
            display: block;
        }
    </style>

    <script>
        //UI function to build analysis HTML
        function buildAnalysisHTML() {
            if (panelState.length === 0) {
                return `<h3>Analysis</h3><p>No panels available for analysis.</p>`;
            }
            let html = `<h3 style="margin:0 0 12px 0;">Analysis</h3>`;
            for (const panel of panelState) {
                const removed = panel.removedEdges.length;
                const coloringCount = panel.colorings?.length ?? colorings.length;
                const diff = colorings.length - coloringCount;

                html += `<div style="margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #555">
                        <b>Panel ${panel.id + 1} </b><br>
                        Removed edges: ${removed}<br>
                        Colorings: ${coloringCount} 
                        (${diff > 0 ? '−' + diff : diff < 0 ? '+' + Math.abs(diff) : 'no change'})<br>
                        ${removed === 0 ? 'No modifications yet' : 
                        `Removed: ${panel.removedEdges.map(([a,b]) => a+'−'+b).join(', ')}`}<br>
                        Degree distribution: ${panel.ckAdj ? JSON.stringify(degreeDistribution(panel.ckAdj)) : 'N/A'} <br>
                        Bottlenecks: ${panel.ckAdj ? JSON.stringify(Object.entries(outDegree(panel.ckAdj)).filter(([node, degree]) => degree > (Object.values(outDegree(panel.ckAdj)).reduce((a, b) => a + b, 0) / Object.values(outDegree(panel.ckAdj)).length)).map(([node]) => node)) : 'N/A'}

                    </div>`;
            }
            return html;
        }

        // all your JS goes here
        function enumerateColorings(vertices, edges, k) {
            function isProper(coloring) {
                return edges.every(([a, b]) => coloring[a] !== coloring[b]);
            }

            const colorings = [];

            function generateColorings(index, assignment) {
                if (index === vertices.length) {
                    if (isProper(assignment)) {
                        colorings.push({ ...assignment });
                    }
                    return;
                }

                const vertex = vertices[index];
                for (let color = 0; color < k; color++) {
                    assignment[vertex] = color;
                    generateColorings(index + 1, assignment);
                }
                delete assignment[vertex];
            }

            generateColorings(0, {});
            return colorings;
        }

        function flippableVertices(coloring, vertices, adjacencyList, k) {
            const flips = {};

            for (const vertex of vertices) {
                const neighborColors = new Set(
                adjacencyList[vertex].map((neighbor) => coloring[neighbor])
                );

                const alternatives = [];

                for (let color = 0; color < k; color++) {
                    if (color !== coloring[vertex] &&
                        !neighborColors.has(color)) {
                        alternatives.push(color);
                    }
                }

                if (alternatives.length > 0) {
                    flips[vertex] = alternatives;
                }
            }

            return flips;
        }
        function ckey(coloring) {
            const sortedEntries = Object.entries(coloring).sort(([a], [b]) => a.localeCompare(b));
            return JSON.stringify(sortedEntries);
        }

        function buildColoringGraphAdj(colorings, vertices, adjacencyList, k, coloringSet) {
            /*
            * Build the adjacency list of C_k(G).
            * Two colorings are adjacent when they differ at exactly one vertex
            * and the recoloring is legal.
            */

            const graph = new Map();

            for (const coloring of colorings) {
                graph.set(ckey(coloring), []);
            }

            for (const coloring of colorings) {
                const flips = flippableVertices(coloring, vertices, adjacencyList, k);
                for (const [vertex, alternatives] of Object.entries(flips)) {
                    for (const newColor of alternatives) {
                        const newColoring = { ...coloring, [vertex]: newColor };
                        if (coloringSet.has(ckey(newColoring))) {
                            graph.get(ckey(coloring)).push(ckey(newColoring));
                        }
                    }
                }
            }
            return graph;
        }
        // x colorings have c neighbours
        function degreeDistribution(ckAdj) {
            const degreeCount = {};
            for (const neighbors of ckAdj.values()) {
                const degree = neighbors.length;
                degreeCount[degree] = (degreeCount[degree] || 0) + 1;
            }
            return degreeCount;
        }

        //actually usable for cytoscape
        function outDegree(ckAdj) {
            const degrees = {};
            for (const [coloringKey, neighbors] of ckAdj.entries()) {
                degrees[coloringKey] = neighbors.length;
            }
            return degrees;
        }
        //set difference: new colorings, lost colorings, preserved
        function diffColorings(ckOld, ckNew) {
            const oldSet = new Set(ckOld.map(ckey));
            const newSet = new Set(ckNew.map(ckey));

            const lost = [...oldSet].filter(x => !newSet.has(x));
            const gained = [...newSet].filter(x => !oldSet.has(x));
            const preserved = [...oldSet].filter(x => newSet.has(x));

            return { lost, gained, preserved };
        }

        function degreeColorCode(elements, degrees, avgDegree) {
            for (const node of elements) {
                if (node.data && !node.data.source) {
                    const degree = degrees[node.data.coloringKey] || 0;
                    if (degree === 0) {
                        node.data.color = "#f87171"; // red for isolated nodes
                    } else if (degree < avgDegree) {
                        node.data.color = "#facc15"; // yellow for degree < avgDegree
                    } else {
                        node.data.color = "#4ade80"; // green for degree > avgDegree
                    }
                }
            }
        }
        
        //Graph sample data
        //const vertices = ['A', 'B', 'C']; // K 1,2
        //const edges = [['A', 'B'], ['B', 'C']]; // K 1,2
        const m = ['A', 'B', 'C']; // K 3
        const n = ['D', 'E', 'F']; // , 3
        const vertices = [...m, ...n]; // K 3,3
        const edges = [];
        for (const left of m) {
            for (const right of n) {
                edges.push([left, right]);
            }
        }

        const adjacencyList = {};
        for (const v of vertices) {
            adjacencyList[v] = [];
        }
        for (const [source, target] of edges) {
            adjacencyList[source].push(target);
            adjacencyList[target].push(source);
        }
        const k = 3;
        const colorings = enumerateColorings(vertices, edges, k);
        const coloringSet = new Set(colorings.map((coloring) => ckey(coloring)));
        const coloringGraphAdj = buildColoringGraphAdj(colorings, vertices, adjacencyList, k, coloringSet);

        //convert map to cytoscape nodes and edges
        //for adjacency list of the coloring graph for visualization with Cytoscape
        const elements = [];
        const edgeIds = new Set();
        const nodeIdByKey = new Map();

        for (const [index, coloring] of colorings.entries()) {
            const key = ckey(coloring);
            const nodeId = `coloring-${index}`;

            //what this does: map coloring key to a node ID for Cytoscape, allowing us to easily ref nodes to create edges between.
            nodeIdByKey.set(key, nodeId); 

            //what this does: create a label in format "vertex:color"
            const label = vertices
                .map(vertex => `${vertex}:${coloring[vertex]}`)
                .join(" ");

            elements.push({ data: { id: nodeId, label: label, coloringKey: key} });
        }

        //what this does: for each coloring, look up its neighbors in coloringGraphAdj list + create edges between corres' nodes.
        for (const [sourceKey, neighbors] of coloringGraphAdj) {
            for (const targetKey of neighbors) {
                const source = nodeIdByKey.get(sourceKey);
                const target = nodeIdByKey.get(targetKey);
                //to prevent duplicate visual edges, we can use a set to track added edges
                const edgeKey = [source, target].sort().join('|');
                if (!edgeIds.has(edgeKey)) {
                    edgeIds.add(edgeKey);
                    elements.push({ data: { id: `edge-${edgeIds.size}`, source, target } });
                }
            }
        }

        const degrees = outDegree(coloringGraphAdj);

        //find bottlenecks
        const values = Object.values(degrees);
        const avgDegree = values.reduce((a, b) => a + b, 0) / values.length;
        const bottlenecks = Object.entries(degrees).filter(([node, degree]) => degree > avgDegree).map(([node]) => node);
        
        //color nodes based on degree
        degreeColorCode(elements, degrees, avgDegree);

        function recomputePanel(panelIndex) {
            const panel = panelState[panelIndex]; //1
            const removedEdges = panel.removedEdges;

            // Recompute the coloring graph based on the removed edges //const newAdjacencyList = { ...adjacencyList }; shallow copy
            const newAdjacencyList = {};
            for (const v of vertices) {
                newAdjacencyList[v] = [...adjacencyList[v]];
            } //2

            for (const [source, target] of removedEdges) {
                newAdjacencyList[source] = newAdjacencyList[source].filter(v => v !== target);  
                newAdjacencyList[target] = newAdjacencyList[target].filter(v => v !== source);
            }

            const newEdges = edges.filter(([a, b]) => !removedEdges.some(([ra, rb]) => (ra === a && rb === b) || (ra === b && rb === a))); //3
            const newColorings = enumerateColorings(vertices, newEdges, k); //4
            const newColoringSet = new Set(newColorings.map((coloring) => ckey(coloring))); //5
            const newColoringGraphAdj = buildColoringGraphAdj(newColorings, vertices, newAdjacencyList, k, newColoringSet); //6

            // Update colors based on degree
            const newDegrees = outDegree(newColoringGraphAdj);
            const values = Object.values(newDegrees);
            const avgDegree = values.reduce((a, b) => a + b, 0) / values.length;

            // Update the coloring graph visualization
            const newElements = [];
            const newEdgeIds = new Set();
            const newNodeIdByKey = new Map();

            //build new nodes for the coloring graph
            for (const [index, coloring] of newColorings.entries()) {
                const key = ckey(coloring);
                const nodeId = `coloring-${index}`;

                newNodeIdByKey.set(key, nodeId);

                const label = vertices
                    .map(vertex => `${vertex}:${coloring[vertex]}`)
                    .join(" ");

                newElements.push({ data: { id: nodeId, label: label, coloringKey: key } });
            }
            //build new edges for the coloring graph
            for (const [sourceKey, neighbors] of newColoringGraphAdj) {
                for (const targetKey of neighbors) {
                    const source = newNodeIdByKey.get(sourceKey);
                    const target = newNodeIdByKey.get(targetKey);
                    const edgeKey = [source, target].sort().join('|');
                    if (!newEdgeIds.has(edgeKey)) {
                        newEdgeIds.add(edgeKey);
                        newElements.push({ data: { id: `edge-${newEdgeIds.size}`, source, target } });
                    }
                }
            }

            //apply color coding based on degree
            degreeColorCode(newElements, newDegrees, avgDegree);

            const nodes3d = newElements
                .filter(el => !el.data.source)
                .map(el => ({id: el.data.id, label: el.data.label, color: el.data.color || '#999'}));
            
            const links3d = newElements
                .filter(el => el.data.source)
                .map(el => ({source: el.data.source, target: el.data.target}));

            panel.ckGraph.graphData({ nodes: nodes3d, links: links3d });

            //store on panel to use later for analysis
            panel.colorings = newColorings;
            panel.ckAdj = newColoringGraphAdj;

            if (document.getElementById('analysis-box').classList.contains('visible')) {
                const box = document.getElementById('analysis-box');
                box.innerHTML = buildAnalysisHTML();
            }

        }

        function createOriginalGraph(containerId, panelIndex) {
            const ogElements = [];

            for (const vertex of vertices) {
                ogElements.push({
                    data: {
                        id: vertex,
                        label: vertex
                    }
                });
            }

            for (const [index, [source, target]] of edges.entries()) {
                ogElements.push({
                    data: {
                        id: `og-edge-${panelIndex}-${index}`,
                        source,
                        target
                    }
                });
            }

            const cy = cytoscape({
                container: document.getElementById(containerId),
                elements: ogElements,

                style: [
                    {
                        selector: "node",
                        style: {
                            label: "data(label)",
                            "background-color": "#e54f46",
                            color: "#111",
                            "text-valign": "center",
                            "text-halign": "center",
                            width: 50,
                            height: 45
                        }
                    },
                    {
                        selector: "edge",
                        style: {
                            width: 3,
                            "line-color": "#999"
                        }
                    }
                ],

                layout: {
                    name: "grid",
                    padding: 20
                }
            });

            cy.on("tap", "edge", function(event) {
                const edge = event.target;
                const edgeData = edge.data();

                panelState[panelIndex].removedEdges.push([
                    edgeData.source,
                    edgeData.target]);

                edge.remove();

                console.log(
                    `Panel ${panelIndex} removed:`,
                    panelState[panelIndex].removedEdges
                );

                // Later, call a recomputation function here:
                recomputePanel(panelIndex);

            });

            return cy;
        }

        function createColoringGraph(containerId, panelIndex) {
            const nodes3d = elements
                .filter(el => !el.data.source)
                .map(el => ({
                    id: el.data.id,
                    label: el.data.label,
                    color: el.data.color || '#999'
                }));

            const links3d = elements
                .filter(el => el.data.source)
                .map(el => ({
                    source: el.data.source,
                    target: el.data.target
                }));

            const graph = ForceGraph3D()(document.getElementById(containerId))
                .graphData({ nodes: nodes3d, links: links3d })
                .nodeColor(node => node.color)
                .nodeLabel(node => node.label)
                .linkColor(() => '#FFFFFF')
                .linkWidth(1)
                .backgroundColor('#000000')
                .width(600)
                .height(500);

            return graph;
        }

        function addPanel(index) {
            const row = document.createElement("div");
            row.className = "panel-row";
            row.innerHTML = `
                <div>
                    <h3>Original graph ${index + 1}</h3>
                    <div id="og-${index}" class="graph-pane"></div>
                </div>

                <div>
                    <h3>Coloring graph ${index + 1}</h3>
                    <div id="ck-${index}" class="graph-pane"></div>
                </div>
            `;
            document.getElementById('panels-container').appendChild(row);

            // init cytoscape for this panel's base graph
            // copy OG edges, make them clickable to remove            
            const panel = {id: index, removedEdges: [], ogCy: null, ckGraph: null };

            panelState.push(panel);

            panel.ogCy = createOriginalGraph(`og-${index}`, index);
            console.log("Original graph nodes:", panel.ogCy.nodes().length, "edges:", panel.ogCy.edges().length);  

            panel.ckGraph = createColoringGraph(`ck-${index}`, index);
            //console.log("Coloring graph nodes:", panel.ckGraph.nodes().length, "edges:", panel.ckGraph.edges().length);
        }

        console.log("Cytoscape type:", typeof cytoscape);
        console.log("Colorings:", colorings);
        console.log("Number of colorings:", colorings.length);
        console.log("Coloring graph:", coloringGraphAdj);
        console.log("Elements:", elements);
        console.log(
            "Nodes:",
            elements.filter(element => !element.data.source && !element.data.target)
        );
        console.log(
            "Edges:",
            elements.filter(element => element.data.source && element.data.target)
        );

        console.log("Before adding panel");
        console.log("Elements available:", elements.length);
        console.log("Cytoscape loaded:", typeof cytoscape);

        const panelState = []; 

        let nextPanelIndex = 0;
        document.getElementById('add-panel-btn').addEventListener('click', function() {
            addPanel(nextPanelIndex);
            nextPanelIndex++; });

        addPanel(nextPanelIndex);
        nextPanelIndex++;

        document.getElementById('analysis-btn').addEventListener('click', () => {
            const box = document.getElementById('analysis-box');
            box.innerHTML = buildAnalysisHTML();
            box.classList.toggle('visible');
        });
    </script>

</body>
</html>
