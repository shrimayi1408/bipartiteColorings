<!DOCTYPE html>
<html>
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
</head>
<body>

    <div id="cy"></div>
    <style>
        #cy {
            width: 100%;
            height: 600px;
            border: 1px solid #ccc;
        }
    </style>

    <script>
        // all your JS goes here
        function enumerateColorings(vertices, edges, k) {
            function isProper(coloring) {
                return edges.every(([a, b]) => coloring[a] !== coloring[b]);
            }

            const colorings = [];

            function generateColorings(index, assignment) {
                if (index === vertices.length) {
                    if (isProper(assignment)) {
                        colorings.push({ ...assignment });
                    }
                    return;
                }

                const vertex = vertices[index];
                for (let color = 0; color < k; color++) {
                    assignment[vertex] = color;
                    generateColorings(index + 1, assignment);
                }
                delete assignment[vertex];
            }

            generateColorings(0, {});
            return colorings;
        }

        function flippableVertices(coloring, vertices, adjacencyList, k) {
            const flips = {};

            for (const vertex of vertices) {
                const neighborColors = new Set(
                adjacencyList[vertex].map((neighbor) => coloring[neighbor])
                );

                const alternatives = [];

                for (let color = 0; color < k; color++) {
                    if (color !== coloring[vertex] &&
                        !neighborColors.has(color)) {
                        alternatives.push(color);
                    }
                }

                if (alternatives.length > 0) {
                    flips[vertex] = alternatives;
                }
            }

            return flips;
        }
        function ckey(coloring) {
            const sortedEntries = Object.entries(coloring).sort(([a], [b]) => a.localeCompare(b));
            return JSON.stringify(sortedEntries);
        }

        function buildColoringGraphAdj(colorings, vertices, adjacencyList, k, coloringSet) {
            /*
            * Build the adjacency list of C_k(G).
            * Two colorings are adjacent when they differ at exactly one vertex
            * and the recoloring is legal.
            */

            const graph = new Map();

            for (const coloring of colorings) {
                graph.set(ckey(coloring), []);
            }

            for (const coloring of colorings) {
                const flips = flippableVertices(coloring, vertices, adjacencyList, k);
                for (const [vertex, alternatives] of Object.entries(flips)) {
                    for (const newColor of alternatives) {
                        const newColoring = { ...coloring, [vertex]: newColor };
                        if (coloringSet.has(ckey(newColoring))) {
                            graph.get(ckey(coloring)).push(ckey(newColoring));
                        }
                    }
                }
            }
            return graph;
        }
        // x colorings have c neighbours
        function degreeDistribution(ckAdj) {
            const degreeCount = {};
            for (const neighbors of ckAdj.values()) {
                const degree = neighbors.length;
                degreeCount[degree] = (degreeCount[degree] || 0) + 1;
            }
            return degreeCount;
        }

        //actually usable for cytoscape
        function outDegree(ckAdj) {
            const degrees = {};
            for (const [coloringKey, neighbors] of ckAdj.entries()) {
                degrees[coloringKey] = neighbors.length;
            }
            return degrees;
        }
        //Graph sample data
        const vertices = ['A', 'B', 'C'];
        const edges = [['A', 'B'], ['B', 'C']];

        const adjacencyList = {A: ["B"], B: ["A", "C"], C: ["B"]};
        const k = 3;
        const colorings = enumerateColorings(vertices, edges, k);
        const coloringSet = new Set(colorings.map((coloring) => ckey(coloring)));
        const coloringGraphAdj = buildColoringGraphAdj(colorings, vertices, adjacencyList, k, coloringSet);

        //convert map to cytoscape nodes and edges
        const elements = [];
        const edgeIds = new Set();
        for (const c of colorings) {
            const nodeId = ckey(c);
            elements.push({ data: { id: nodeId, label: nodeId } });
        }
        for (const [source, neighbors] of coloringGraphAdj) {
            for (const target of neighbors) {
                //to prevent duplicate visual edges, we can use a set to track added edges
                const edgeKey = [source, target].sort().join('-');
                if (!edgeIds.has(edgeKey)) {
                    edgeIds.add(edgeKey);
                    elements.push({ data: { id: `edge-${edgeIds.size}`, source, target } });
                }
            }
        }

        const degrees = outDegree(coloringGraphAdj);

        //find bottlenecks
        const values = Object.values(degrees);
        const avgDegree = values.reduce((a, b) => a + b, 0) / values.length;
        const bottlenecks = Object.entries(degrees).filter(([node, degree]) => degree > avgDegree).map(([node]) => node);
        

        //color nodes based on degree
        for (const node of elements) {
            if (node.data && node.data.id) {
                const degree = degrees[node.data.id] || 0;
                if (degree === 0) { 
                    node.data.color = "#f87171"; // red for isolated nodes
                } else if (degree < avgDegree) {
                    node.data.color = "#facc15"; // yellow for degree < avgDegree
                } else {
                    node.data.color = "#4ade80"; // green for degree > avgDegree
                }
            }
        }

        //create Cytospace graph
        const cy = cytoscape({ container: document.getElementById('cy'), elements, style: [{ 
            selector: 'node', 
            style: { 
                label: "data(label)",
                "font-size": 5,
                "background-color": "data(color)",
                color: "#111",
                "text-valign": "center",
                "text-halign": "center",
                width: 40,
                height: 40 } },
            {
                selector: "edge",
                style: {
                    width: 2,
                    "line-color": "#999"
                }
            }],
        layout: { name: "cose", animate: true } 
    });
    </script>

</body>
</html>
